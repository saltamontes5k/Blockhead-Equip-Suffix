[Settings]
; Logging=0 to disable the log file, 1 to enable (default=1)
Logging=1

[EquipRaceGroups]
; group=Race1,Race2,...
; Appends _<group> before .nif for these races.
; Files go next to the original mesh:
;   Data\Meshes\<original path>\<filename>_<group>.nif
; Example: Greaves.nif -> Data\Meshes\Armor\IronGreaves\Greaves_0.nif
0=Orc,Nord,Dremora
;1=Imperial,Breton,Redguard

[EquipNPCGroups]
; alias=FormID1,FormID2,...
; Appends _<alias> before .nif for these specific NPCs.
; Files go next to the original mesh:
;   Data\Meshes\<original path>\<filename>_<alias>.nif
; Example: Greaves.nif -> Data\Meshes\Armor\IronGreaves\Greaves_pconly.nif
pconly=00000007
;bigguys=000222B6,00035727,0000BE80,00037FF8

[EquipInvisible]
; FormID or FormID=Slot1,Slot2,...
; Plain FormID = hide all equipment slots (fully invisible NPC).
; FormID=Slots = hide all slots EXCEPT those listed.
;
; Slot names: Head Hair UpperBody LowerBody Hand Foot
;             RightRing LeftRing Amulet Weapon BackWeapon SideWeapon
;             Quiver Shield Torch Tail
;
; Only the weapon floats in the air, nothing else:
002353=Weapon
;
; Weapon and shield visible on an invisible body:
;000980E0=Weapon,BackWeapon,Shield

; ------------------------------------------------------------------
; [EquipRules] -- the ONE suffix rule engine
; ------------------------------------------------------------------
; A rule's suffix is applied to EVERY asset type (equipment meshes,
; weapons, body meshes/textures, head meshes/textures, body EGT). What a
; rule actually overrides is decided by the FILES you author for it:
;
;   - EQUIPMENT / WEAPON rules affect the mesh paths the item uses:
;       Cuirass.nif    -> Cuirass_<suffix>.nif
;       WaalxSword.nif -> WaalxSword_<suffix>.nif
;       (armor/clothing/weapon meshes live in Data\Meshes\...)
;
;   - BODY / HEAD rules affect the actor's own assets:
;       Textures\Characters\Imperial\HeadHuman.dds -> HeadHuman_<suffix>.dds
;       Meshes\Characters\_Male\UpperBody.NIF       -> UpperBody_<suffix>.NIF
;       plus the per-race / per-NPC override folders:
;       Meshes\Characters\BodyAssetOverrides\PerRace\M\Orc_<suffix>_UpperBody.NIF
;       (see the README for the full folder layout)
;
; The examples below are split into two groups so you can tell them apart.
;
; ------------------------------------------------------------------
; Format: <suffix>=<clause>, <clause>, ...
; All clauses in a rule must be true (AND). Rules are evaluated
; top-to-bottom; the FIRST rule whose clauses all pass wins.
;
; Clause types:
;   npc:<hexformid>       NPC base form ID matches
;   race:<name|hexfid>    race display name (case-insensitive) or form ID
;   fac:<hexformid>       NPC is in the faction (form ID)
;   class:<hexformid>     NPC's class matches (form ID)
;   inv:<hexformid>:<op>:<n>   inventory count of item vs n  (gold = Gold001)
;   ws:<hexformid>        actor's current worldspace matches
;   cell:<hexformid>      actor's current cell matches
;   qst:<hexformid>:<op>:<n>   quest's current stage vs n
;   qvar:<hexformid>:<var|idx>:<op>:<n>   quest script variable runtime value
;   gst:<editorID>:<op>:<n>  numeric Game Setting value
;   wtr:<hexformid|name>  current weather form ID, or precipitation name
;                         (none|clear|cloudy|rain|snow)
; Ops: == != < <= > >=
;
; ==================================================================
;  BODY / HEAD rules  (actor's own meshes + textures)
; ==================================================================
; BLADES demo (ACTIVE): all Blades get *_blade.suffixed HEAD textures.
; Faction FormID 000274AB (verified). Author scarred head textures as
; Textures\Characters\<race>\<basehead>_blade.dds; missing files fall
; through to the vanilla head texture.
blade=fac:000274AB
;
;   Body/head example - race-variant body texture (Orcs -> *_0 texture):
;orcbody=race:Orc
;   Body/head example - per-race override folder (one rule, any race):
;brute=fac:0002347A
;
; ==================================================================
;  EQUIPMENT / WEAPON rules  (armor, clothing, weapons)
; ==================================================================
;   Rich player (over 10000 gold) -> Cuirass_rich.nif:
;rich=inv:0000000F:>:10000
;   In any of the Oblivion plane worlds -> Cuirass_plane.nif.
;   (One rule per worldspace - clauses AND, so "ws:A, ws:B" would never
;   match. Duplicate "plane=" rules with the same suffix give first-match
;   "any of" behavior.)
;plane=ws:0003E50A
;plane=ws:0001D0BC
;plane=ws:0003F551
;plane=ws:0004A99F
;plane=ws:0002C5E4
;plane=ws:0004FAED
;plane=ws:0005222A
;plane=ws:00099C15
;   Rainy weather -> Cuirass_rain.nif:
;rain=wtr:rain
;   Glarthir / Paranoia (quest 00028D83): stage 50+ = help, 70+ = told the
;   guards. Customizes his look per branch:
;gally=npc:000294C3,qst:00028D83:>=:50,qst:00028D83:<:70
;gtattle=npc:000294C3,qst:00028D83:>=:70
;   GMST-gated gear (e.g. a global combat-rate setting):
;slowmo=gst:fGlobalTimeMultiplier:==:0.5
;   Race-variant weapon (High Elf holds WaalxSword -> WaalxSword_elf.nif):
;elf=race:High Elf
;   NPC-variant weapon (player -> WaalxSword_pconly.nif):
;wpn_pconly=npc:00000007
;
[EquipRules]

; ------------------------------------------------------------------
; [EquipFactionGroups] -- legacy faction groups
; Format: <suffix>=<hexformid>, <hexformid>, ...
; NPC in ANY listed faction matches.
; ------------------------------------------------------------------
[EquipFactionGroups]

; ------------------------------------------------------------------
; [EquipClassGroups] -- legacy class groups
; Format: <suffix>=<hexformid>, <hexformid>, ...
; NPC whose class is ANY listed form ID matches.
; ------------------------------------------------------------------
[EquipClassGroups]

; ------------------------------------------------------------------
; [HeadOverride] -- facegen head model/texture overrides
; ------------------------------------------------------------------
; OPT-IN, OFF by default. When Enabled=1, head components resolve category
; suffixes inside the facegen pipeline (like body assets do):
;   Characters\Imperial\HeadHuman.dds -> HeadHuman_blade.dds
;   Characters\HeadAssetOverrides\PerRace\M\Imperial_blade_Head.dds
;   Characters\HeadAssetOverrides\PerNPC\Oblivion.esm\00000007_blade_Head.dds
; When OFF the head detour is a pure passthrough (the Blades head-texture
; demo above needs this ON). Enable only with real *_blade head assets.
; Watch BlockheadEquipSuffix.log for "[Head]" lines.
[HeadOverride]
; Set Enabled=1 to turn on (default=0)
Enabled=1

